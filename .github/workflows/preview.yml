name: preview

on:
  pull_request:
    branches:
      - main

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run verify

  pr-comments:
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v9
        with:
          script: |
            const { readFile } = await import('node:fs/promises');

            const MARKER = '<!-- PREVIEW-RELEASE -->';
            const issue_number = context.issue.number;
            const ref = context.payload.pull_request.head.sha;
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: issue_number,
              per_page: 100,
            });
            const files = changed
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename)
              .filter((f) => f.startsWith('.changeset/') && f.endsWith('.md') && f !== '.changeset/README.md');

            let body;
            const parsed = await Promise.all(
              files.map(async (f) => {
                const { data } = await github.rest.repos.getContent({ ...context.repo, path: f, ref });
                const raw = Buffer.from(data.content, 'base64').toString('utf8');
                const bump = raw.match(/["']@adistack\/conform["']\s*:\s*(major|minor|patch)/)?.[1];
                const text = raw.replace(/^---[\s\S]*?---/, '').trim().split('\n').slice(0, 10).join('\n  > ');
                return { bump, f, text };
              }),
            );
            const releasing = parsed.filter((p) => p.bump);
            if (releasing.length === 0) {
              const { version } = JSON.parse(await readFile('package.json', 'utf8'));
              body = [
                MARKER,
                '## Release preview',
                '',
                `**Package version:** \`${version}\` (no changesets for \`@adistack/conform\` — merge will not release).`,
                '',
                'Add a `.changeset/*.md` file.',
              ].join('\n');
            } else {
              const rank = { patch: 0, minor: 1, major: 2 };
              let top = 'patch';
              for (const { bump } of releasing) if (rank[bump] > rank[top]) top = bump;
              body = [
                MARKER,
                '## Release preview',
                '',
                `**Change type:** \`${top.toUpperCase()}\``,
                '',
                '### Changelog preview (this PR only)',
                '',
                ...releasing.map(({ f, bump, text }) => `- \`${f}\` (${bump})\n  > ${text}`),
                '',
                'Note: Only changesets changed in this PR are shown — other unreleased changesets on `main` are excluded.',
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(MARKER) && c.user?.login === 'github-actions[bot]');
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
