name: preview

on:
  pull_request:
    branches:
      - main

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run verify

  pr-comments:
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v9
        with:
          script: |
            const { readFile } = await import('node:fs/promises');

            const MARKER = '<!-- release-preview -->';
            const issue_number = context.issue.number;
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: issue_number,
              per_page: 100,
            });
            const files = changed
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename)
              .filter((f) => f.startsWith('.changeset/') && f.endsWith('.md') && f !== '.changeset/README.md');

            let body;
            const parsed = await Promise.all(
              files.map(async (f) => {
                const raw = await readFile(f, 'utf8');
                const bump = raw.match(/["']@adistack\/conform["']\s*:\s*(major|minor|patch)/)?.[1];
                const text = raw.replace(/^---[\s\S]*?---/, '').trim().split('\n').slice(0, 10).join('\n  > ');
                return { bump, f, text };
              }),
            );
            const releasing = parsed.filter((p) => p.bump);
            if (releasing.length === 0) {
              const { version } = JSON.parse(await readFile('package.json', 'utf8'));
              body = `${MARKER}\n## Release preview\n\n**Package version:** \`${version}\` (no changesets for \`@adistack/conform\` — merge will not release).\n\nAdd a \`.changeset/*.md\` file.`;
            } else {
              const rank = { patch: 0, minor: 1, major: 2 };
              let top = 'patch';
              for (const { bump } of releasing) if (rank[bump] > rank[top]) top = bump;
              const entries = releasing.map(({ f, bump, text }) => `- \`${f}\` (${bump})\n  > ${text}`);
              body = `${MARKER}\n## Release preview\n\n**Change type:** \`${top.toUpperCase()}\`\n\n### Changelog preview (from changesets)\n\n${entries.join('\n')}\n\nMerging runs \`changeset version\` on \`main\`, which writes this into \`CHANGELOG.md\` + \`package.json\`.`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(MARKER) && c.user?.login === 'github-actions[bot]');
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
